version: "0.0.1"

upstream:
  source: "https://github.com/ming2k/docs-governance"
  ref: "v0.0.1"

root_sanitization:
  enforce: true
  allowed_markdown:
    - "README.md"
    - "CHANGELOG.md"
    - "CONTRIBUTING.md"
    - "AGENTS.md"
    - "LICENSE.md"
    - "SECURITY.md"

firewall:
  public_surfaces:
    - "docs/tutorials/**"
    - "docs/how-to/**"
    - "docs/reference/**"
    - "docs/explanation/**"
  internal_surfaces:
    - "docs/dev/**"

architecture:
  adr_path: "docs/adr"
  require_frontmatter:
    status_enum: ["draft", "accepted", "superseded", "rejected", "deprecated"]
    mandatory_fields: ["id", "title", "status", "date"]

agent_directives:
  enforce: true
  targets:
    - "AGENTS.md"

triggers:
  - watch: "src/**"
    require_update: "docs/**"
    message: "Core toolchain modified; ensure documentation is synchronized."
