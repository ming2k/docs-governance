[package]
name = "docgov"
version = "0.0.1"
edition = "2021"
description = "High-performance, zero-vendoring documentation and architecture governance linter"
license = "MIT"
authors = ["ming2k <ming2k@users.noreply.github.com>"]
readme = "README.md"
homepage = "https://github.com/ming2k/docs-governance"
repository = "https://github.com/ming2k/docs-governance"

[[bin]]
name = "docgov"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
glob = "0.3"
walkdir = "2.5"
colored = "2.1"
anyhow = "1.0"
ureq = "2.10"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.17"
